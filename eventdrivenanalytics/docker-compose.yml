version: "3.9"

services:

  oltp-db:
    image: postgres:16
    container_name: oltp-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders

    ports:
      - "5432:5432"

    volumes:
      - oltp_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  olap-db:
    image: postgres:16
    container_name: olap-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics

    ports:
      - "5433:5432"

    volumes:
      - olap_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./services/cdc-worker

    depends_on:
      oltp-db:
        condition: service_healthy
      olap-db:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "8000:8000"
    depends_on:
      oltp-db:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: ./services/analytics-service
    ports:
      - "8081:8081"
    depends_on:
      olap-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oltp_data:
  olap_data: