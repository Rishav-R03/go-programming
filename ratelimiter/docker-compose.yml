services:
  postgres:
    image: postgres:16-alpine
    container_name: ratelimiter-postgres
    restart: unless-stopped
    environment:  
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ratelimiter
      POSTGRES_DB: ratelimiter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ratelimiter"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ratelimiter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimiter-api
    restart: unless-stopped
    depends_on: 
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://ratelimiter:ratelimiter@postgres:5432/ratelimiter?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      HTTP_PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  pgdata: