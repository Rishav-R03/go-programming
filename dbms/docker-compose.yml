version: '3.8'

services:
  postgres:
    image: postgres:17-alpine 
    container_name: ecommmerce_db 
    restart: always 
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 
      - ./internal/database/database.sql:/docker-entrypoint-initdb.d/database.sql

volumes:
  postgres_data:
    driver: local
    
      